[package]
name = "ox-ontology"
description = "Ontosyx ontology model — NodeType / EdgeType / Interface / Property / Rule (SHACL) / Function / Action / Metric / Enrichment / Glossary / Mapping / Provenance / DataQuality / Drift / Audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Expose the Korean e-commerce fixture + other shared test helpers to
# downstream test suites. Gated on a feature so production builds
# don't link the fixture strings.
test-fixtures = []

[dependencies]
ox-core = { workspace = true }

# Identity / serialization / schema — every public type in this crate
# ultimately lands here.
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
utoipa = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
ox-ontology = { path = ".", features = ["test-fixtures"] }

[lints]
workspace = true
