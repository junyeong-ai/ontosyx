[package]
name = "ox-context"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Single-purpose crate that propagates ontosyx's request-scope identity
# (workspace_id / system bypass) across tokio::spawn and tower middleware
# boundaries. Sits one level above ox-store and ox-graph-runtime so both
# task-local pairs (store + graph) capture and re-apply through a single
# entry point.

[dependencies]
ox-store = { workspace = true }
ox-graph-runtime = { workspace = true }
entelix = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
# `ContextScope::scope_stream` returns `impl Stream` and uses
# `async_stream::stream!` to re-enter the captured task-locals on every
# `poll_next`. Both crates flow through the workspace pin so consumer
# crates inherit one major.
futures-core = { workspace = true }
async-stream = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
parking_lot = "0.12"
# `scope_stream` tests collect Stream items — `futures::StreamExt` is
# the canonical collector. Tests stay aligned with the rest of the
# workspace's `futures` major.
futures = { workspace = true }
