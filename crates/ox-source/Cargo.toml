[package]
name = "ox-source"
description = "Ontosyx data source introspection (schema discovery + profiling)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ox-core = { workspace = true }
ox-ontology = { workspace = true }
ox-gcp = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
utoipa = { workspace = true }
csv = { workspace = true }
mongodb = { workspace = true }
snowflake-api = { workspace = true }
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
gcp-bigquery-client = { workspace = true }
tracing = { workspace = true }
ignore = { workspace = true }
tempfile = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
url = "2.5"
duckdb = { workspace = true, optional = true }

[features]
duckdb = ["dep:duckdb"]
# Live BigQuery integration tests. Off by default — requires
# Application Default Credentials and `OXY_BIGQUERY_PROJECT` /
# `OXY_BIGQUERY_DATASET` env vars at runtime. Set
# `OXY_REQUIRE_BIGQUERY_TESTS=true` in CI to escalate skip-on-missing-
# credentials to a hard failure.
bigquery-integration-tests = []

[lints]
workspace = true
