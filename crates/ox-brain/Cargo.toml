[package]
name = "ox-brain"
description = "Ontosyx LLM orchestration — natural language to IR translation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ox-core = { workspace = true }
ox-ontology = { workspace = true }
ox-query-ir = { workspace = true }
ox-memory = { workspace = true }
ox-store = { workspace = true }
branchforge = { workspace = true, features = ["aws", "cli-auth"] }
dashmap = "6"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
futures-core = "0.3"
tokio-stream = "0.1"
async-stream = "0.3.6"
toml = "0.9"
schemars = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = "0.10.9"

[features]
# Re-usable test fixtures (`MockLlmCall`, `make_text_response`, …)
# for downstream integration tests that need a deterministic LLM
# without standing up a real provider. Mirrors the
# `ox-api/test-helpers` pattern. Off by default so production
# builds never link the helpers.
test-helpers = []

[lints]
workspace = true
