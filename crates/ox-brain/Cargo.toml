[package]
name = "ox-brain"
description = "Ontosyx LLM orchestration — natural language to IR translation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
ox-core = { workspace = true }
ox-ontology = { workspace = true }
ox-query-ir = { workspace = true }
ox-compiler = { workspace = true }
ox-memory = { workspace = true }
ox-store = { workspace = true }
ox-text = { workspace = true }
# Migration in progress (Phase 1) — entelix is the new LLM runtime; the
# branchforge dep stays until ox-agent/ox-api migrations land (Phase 4-5)
# and is removed in Phase 6.
entelix = { workspace = true, features = ["auth-claude-code"] }
branchforge = { workspace = true, features = ["cli-auth"] }
dashmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
futures-core = { workspace = true }
tokio-stream = { workspace = true }
async-stream = { workspace = true }
toml = "1"
schemars = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
futures-util = "0.3"

[features]
# Re-usable test fixtures (`MockLlmCall`, `make_text_response`, …)
# for downstream integration tests that need a deterministic LLM
# without standing up a real provider. Mirrors the
# `ox-api/test-helpers` pattern. Off by default so production
# builds never link the helpers.
test-helpers = []
llm-aws = ["branchforge/aws", "entelix/aws"]

[lints]
workspace = true
