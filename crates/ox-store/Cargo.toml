[package]
name = "ox-store"
description = "Ontosyx app state persistence (PostgreSQL)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ox-core = { workspace = true }
utoipa = { workspace = true }
ox-ontology = { workspace = true }
ox-query-ir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
ox-ontology = { workspace = true, features = ["test-fixtures"] }
# `temporal_integration` exercises the full
# `OntologyVersionStore::resolve_version_at` →
# `rewrite_temporal_with_renames` chain end-to-end; the rewriter
# lives in ox-compiler and is only needed under cfg(test).
ox-compiler = { workspace = true }
# `advisory_lock_integration` spawns parallel callers and joins
# them via `futures::future::join_all`; only the integration
# tests need it, not production code.
futures = { workspace = true }

[lints]
workspace = true
