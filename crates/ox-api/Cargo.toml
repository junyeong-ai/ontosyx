[package]
name = "ox-api"
description = "Ontosyx HTTP/WebSocket API server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ontosyx"
path = "src/main.rs"

[dependencies]
ox-core = { workspace = true }
ox-ontology = { workspace = true }
ox-query-ir = { workspace = true }
ox-compiler = { workspace = true }
ox-runtime = { workspace = true }
ox-brain = { workspace = true }
ox-agent = { workspace = true }
ox-store = { workspace = true }
ox-source = { workspace = true, features = ["duckdb"] }
ox-federation = { workspace = true }
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
ox-memory = { workspace = true, features = ["onnx"] }
branchforge = { workspace = true, features = ["aws"] }
async-trait = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
config = { workspace = true }
jsonwebtoken = { workspace = true }
dashmap = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
cron = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
futures = "0.3"
futures-core = "0.3"
tokio-stream = "0.1"
async-stream = "0.3.6"
url = "2.5.8"
sha2 = "0.10.9"
reqwest = { workspace = true }
# Optional GCP Secret Manager resolver — enabled with feature `gcp-sm`.
ox-gcp = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
sqlx = { workspace = true }
tempfile = { workspace = true }
mockall = { workspace = true }
http-body-util = "0.1"

[[bench]]
name = "query_compile"
harness = false

# Opt-in helper for downstream integration tests that need a
# pre-authenticated `Principal` without wiring full JWT + cookie
# state (`Principal::test_admin()`). Production builds do NOT
# enable this — the helper is compiled out of the release binary
# entirely, so there is no runtime path to skip authentication.
[features]
test-helpers = []
# GCP Secret Manager resolver. Off by default — the env: + file:
# resolvers cover most deployments. Enable on GCP-hosted servers
# that want to dereference `gcp-sm:` references through Application
# Default Credentials.
gcp-sm = ["dep:ox-gcp", "dep:base64"]


[lints]
workspace = true
