# Dependabot — managed dep updates across every ecosystem the repo
# carries. Grouped PRs land per-week so review burden stays bounded
# (one PR per ecosystem, not one per crate / package). Major bumps
# arrive as a separate PR — they can break compile / runtime and
# deserve isolated review.

version: 2
updates:
  # ---------------------------------------------------------------------------
  # Backend Cargo workspace
  # ---------------------------------------------------------------------------
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      rust-patch-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
      rust-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # onnxruntime / ort 는 native lib 이라 dep 만 올리면 빌드 깨짐.
      # 상응하는 .github/actions/install-onnxruntime 의 version input
      # 과 함께 수동 bump 한다.
      - dependency-name: "ort"
      - dependency-name: "onnxruntime"

  # ---------------------------------------------------------------------------
  # Frontend pnpm workspace
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "web"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      web-patch-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
      web-security:
        applies-to: security-updates
        patterns: ["*"]

  # ---------------------------------------------------------------------------
  # GitHub Actions — keep runners + reusable actions on supported tags
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  # ---------------------------------------------------------------------------
  # Container base images — Dockerfile FROM stanzas
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
