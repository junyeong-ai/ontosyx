name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

# Cancel superseded runs on PR / merge-queue branches so a rapid push
# storm doesn't pile up duplicate work. `main` keeps every run for an
# immutable audit trail — `cancel-in-progress: false` only when ref
# == main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Default to the least-privileged token. Jobs that need to comment
# on PRs, post status checks, or upload artefacts override below.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: 1.95.0

jobs:
  # ---------------------------------------------------------------------------
  # Change detection — every always-running job downstream gates on
  # the matching output so a web-only PR doesn't pay for the Rust
  # pipeline (and vice versa). `main` pushes force every gate so the
  # branch tip is always fully verified.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    # paths-filter only meaningfully diffs against a base ref on
    # `pull_request`. `push` / `merge_group` / `workflow_dispatch`
    # always force every gate (branch tip + merge queue must be fully
    # verified), so this job is gated to PRs and downstream `if`s
    # treat a missing output as "force-on" via the event-name escape.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      docker: ${{ steps.filter.outputs.docker }}
      schema: ${{ steps.filter.outputs.schema }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `crates/**` covers all backend code; the manifests + lock
          # + cargo-deny config are part of the Rust contract too.
          # `web/**` is the frontend; `web/openapi.json` lives there
          # but is regenerated from BE so it counts as schema.
          # `docker:` re-uses the rust filter on top of the
          # Dockerfile / .dockerignore — any Rust dep change can
          # invalidate the chef cache.
          # `schema:` triggers the OpenAPI drift gate when ox-api
          # surfaces or the generated typescript shape changes.
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/install-onnxruntime/**'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            schema:
              - 'crates/ox-api/**'
              - 'crates/ox-core/**'
              - 'crates/ox-ontology/**'
              - 'web/openapi.json'
              - 'web/src/types/api.generated.ts'
              - '.github/workflows/ci.yml'

  # ---------------------------------------------------------------------------
  # Backend — Rust pipeline (lint / test / deny / rls / udeps)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (Rust)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/install-onnxruntime

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (workspace, all targets, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    needs: [changes, lint]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/install-onnxruntime

      # cargo-nextest is the canonical Rust test runner — parallelism
      # + clean output + per-test timing. taiki-e/install-action
      # ships a prebuilt binary, so we skip the ~30s `cargo install`.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # nextest builds + runs in one pass — a separate `cargo build`
      # step would just rebuild everything immediately afterwards.
      - name: Test (nextest)
        run: cargo nextest run --workspace --no-fail-fast

      # nextest does not run doc tests (separate runner contract).
      # cargo's built-in `--doc` runner is the canonical fallback.
      - name: Doc tests
        run: cargo test --workspace --doc

  deny:
    name: cargo-deny (advisories + licenses)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny (all features)
        run: cargo deny --all-features check --hide-inclusion-graph

  # ---------------------------------------------------------------------------
  # RLS enforcement — runs the `#[ignore]`-gated tests in
  # `crates/ox-store/tests/rls_enforcement.rs` against a live Postgres.
  #
  # These tests validate that the canonical schema isolates workspaces
  # at the row level. They can only run with a real DB connection, so
  # we keep them out of the default `cargo test` and gate them behind
  # this dedicated job.
  # ---------------------------------------------------------------------------
  rls:
    name: RLS Enforcement
    needs: [changes, lint]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      # `pgvector/pgvector:pg16` is the upstream-maintained Postgres
      # 16 image with `vector` precompiled in. The base `postgres:16`
      # ships without the extension binary, so `CREATE EXTENSION
      # vector` would fail with "control file not found" before any
      # test runs. `pg_trgm` / `uuid-ossp` / `btree_gin` ride on the
      # standard contrib bundle that both images carry.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ontosyx_app
          POSTGRES_PASSWORD: ontosyx-dev
          POSTGRES_DB: ontosyx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ontosyx_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OX_TEST_DATABASE_URL: postgres://ontosyx_app:ontosyx-dev@localhost:5432/ontosyx
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/install-onnxruntime

      - name: Install Postgres extensions on the service container
        run: |
          docker exec "$(docker ps -q -f ancestor=pgvector/pgvector:pg16)" \
              psql -U ontosyx_app -d ontosyx -c \
              "CREATE EXTENSION IF NOT EXISTS vector;
               CREATE EXTENSION IF NOT EXISTS pg_trgm;
               CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";
               CREATE EXTENSION IF NOT EXISTS btree_gin;"

      - name: Run RLS enforcement + temporal + retrieval-golden tests
        # `rls_invariants` is the catalog-scan gate that fails when a
        # workspace-scoped table is added without the required RLS
        # clauses. `eval_retrieval_golden` is the deterministic IR-axis
        # retrieval gate.
        run: |
          cargo test -p ox-store --test integration -- --ignored --nocapture --test-threads=1 \
            integration::rls_enforcement \
            integration::rls_invariants \
            integration::temporal \
            integration::eval_retrieval_golden

  udeps:
    # Advisory: reports unused deps. `continue-on-error: true` so a
    # false positive doesn't block until the baseline is clean.
    name: cargo-udeps (unused deps, advisory)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps
      - uses: ./.github/actions/install-onnxruntime
      - name: cargo udeps
        run: cargo +nightly udeps --workspace --all-targets

  # ---------------------------------------------------------------------------
  # Frontend — Next.js + audit pipeline + axe E2E
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.3
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium
      - name: Biome (lint, error-on-warnings)
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: i18n audit
        run: pnpm i18n-audit
      - name: i18n parity audit
        run: pnpm i18n-parity-audit
      - name: i18n dotted-key audit
        run: pnpm i18n-dotted-key-audit
      - name: ApiErrorCode parity audit
        run: pnpm error-code-parity-audit
      - name: API error envelope audit
        run: pnpm api-error-envelope-audit
      - name: Platform port parity audit
        run: pnpm platform-port-parity-audit
      - name: Source feature parity audit
        run: pnpm source-feature-parity-audit
      - name: Heading primitive audit
        run: pnpm heading-primitive-audit
      - name: UI drift audit
        run: pnpm ui-drift-audit
      - name: Contrast audit
        run: pnpm contrast-audit
      - name: '"use client" placement audit'
        run: pnpm use-client-audit
      - name: Source-size budget
        run: pnpm source-size-audit
      - name: Design rules audit
        run: pnpm design-rules-audit
      - name: Vitest
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Accessibility (axe) — full-page
        run: pnpm test:a11y:no-build

  # ---------------------------------------------------------------------------
  # Container build — exercises the production Dockerfile end-to-end.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker Build
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ontosyx:ci
          # GHA-cache lifts the cargo-chef + apt + final layer cache
          # across PRs. The chef stage already memoizes Rust deps, so
          # this catches the long-tail rebuilds that aren't dep-only.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # OpenAPI drift — regenerates the spec + diffs against the
  # committed `web/openapi.json`. Catches BE→FE schema drift before
  # the front-end build silently runs against a stale shape.
  # ---------------------------------------------------------------------------
  openapi-drift:
    name: OpenAPI Drift
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.3
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: ./.github/actions/install-onnxruntime

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Regenerate and diff
        run: bash scripts/check-openapi-drift.sh

  # ---------------------------------------------------------------------------
  # Korean golden E2E — label-gated (`e2e-korean`).
  # ---------------------------------------------------------------------------
  e2e-korean:
    name: Korean E2E
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'e2e-korean')
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-onnxruntime
      - name: Run Korean E2E
        run: bash scripts/e2e-korean.sh

  # ---------------------------------------------------------------------------
  # LLM token regression — label-gated (`token-bench`).
  # ---------------------------------------------------------------------------
  token-regression:
    name: Token Regression
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'token-bench')
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-onnxruntime
      - name: Run token regression check
        run: bash scripts/check-token-regression.sh

  # ---------------------------------------------------------------------------
  # Frontend Playwright E2E — label-gated (`e2e-fe`).
  # ---------------------------------------------------------------------------
  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'e2e-fe')
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.3
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      - name: Playwright
        run: pnpm test:e2e:no-build

  # ---------------------------------------------------------------------------
  # Lighthouse CI — label-gated (`lighthouse`).
  # ---------------------------------------------------------------------------
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'lighthouse')
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.3
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Lighthouse
        run: pnpm lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # ---------------------------------------------------------------------------
  # Criterion bench regression — label-gated (`bench`).
  # ---------------------------------------------------------------------------
  bench-regression:
    name: Bench Regression
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'bench')
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-onnxruntime
      - name: Run benches
        run: cargo bench -p ox-api -- --output-format bencher | tee bench-output.txt
      - name: Compare against baseline
        run: bash scripts/check-bench-regression.sh bench-output.txt bench/baseline.json

  # ---------------------------------------------------------------------------
  # Single required-status aggregator for branch protection.
  # Skipped jobs (paths-filter conditional) count as success — the
  # branch tip stays verified across the matrix even when a PR
  # touches only one half of the monorepo.
  # ---------------------------------------------------------------------------
  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [changes, lint, test, deny, rls, frontend, docker, openapi-drift]
    if: always()
    steps:
      - name: Aggregate status
        # `changes` is included so a paths-filter failure (e.g. action
        # outage) doesn't silently chain into all-skipped downstream
        # and slip past branch protection. `success` (PR) and `skipped`
        # (push / merge_group / dispatch — `changes` is PR-only) both
        # count as healthy.
        run: |
          fail=0
          for job in changes lint test deny frontend docker openapi-drift rls; do
            case "$job" in
              changes)       result="${{ needs.changes.result }}" ;;
              lint)          result="${{ needs.lint.result }}" ;;
              test)          result="${{ needs.test.result }}" ;;
              deny)          result="${{ needs.deny.result }}" ;;
              frontend)      result="${{ needs.frontend.result }}" ;;
              docker)        result="${{ needs.docker.result }}" ;;
              openapi-drift) result="${{ needs.openapi-drift.result }}" ;;
              rls)           result="${{ needs.rls.result }}" ;;
            esac
            echo "$job=$result"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::Required job '$job' did not succeed (result=$result)"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "All required jobs passed (or were legitimately skipped)."
