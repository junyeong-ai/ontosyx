name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # 6.1 Backend CI gates
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Install onnxruntime
        run: |
          wget -q https://github.com/microsoft/onnxruntime/releases/download/v1.21.1/onnxruntime-linux-x64-1.21.1.tgz
          tar xzf onnxruntime-linux-x64-1.21.1.tgz
          echo "ORT_LIB_LOCATION=$PWD/onnxruntime-linux-x64-1.21.1/lib" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$PWD/onnxruntime-linux-x64-1.21.1/lib" >> $GITHUB_ENV

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (workspace, all targets, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install onnxruntime
        run: |
          wget -q https://github.com/microsoft/onnxruntime/releases/download/v1.21.1/onnxruntime-linux-x64-1.21.1.tgz
          tar xzf onnxruntime-linux-x64-1.21.1.tgz
          echo "ORT_LIB_LOCATION=$PWD/onnxruntime-linux-x64-1.21.1/lib" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$PWD/onnxruntime-linux-x64-1.21.1/lib" >> $GITHUB_ENV

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  deny:
    name: cargo-deny (advisories + licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  udeps:
    # Advisory-only: reports unused deps. Not a gate until the baseline is clean.
    # Flip `continue-on-error: false` once `cargo udeps` reports no false positives.
    name: cargo-udeps (unused deps, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked
      - name: Install onnxruntime
        run: |
          wget -q https://github.com/microsoft/onnxruntime/releases/download/v1.21.1/onnxruntime-linux-x64-1.21.1.tgz
          tar xzf onnxruntime-linux-x64-1.21.1.tgz
          echo "ORT_LIB_LOCATION=$PWD/onnxruntime-linux-x64-1.21.1/lib" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$PWD/onnxruntime-linux-x64-1.21.1/lib" >> $GITHUB_ENV
      - name: cargo udeps
        run: cargo +nightly udeps --workspace --all-targets

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Vitest
        run: pnpm test
      - name: Build
        run: pnpm build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Docker image
        run: docker build -t ontosyx:ci .

  openapi-drift:
    name: OpenAPI Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install onnxruntime
        run: |
          wget -q https://github.com/microsoft/onnxruntime/releases/download/v1.21.1/onnxruntime-linux-x64-1.21.1.tgz
          tar xzf onnxruntime-linux-x64-1.21.1.tgz
          echo "ORT_LIB_LOCATION=$PWD/onnxruntime-linux-x64-1.21.1/lib" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$PWD/onnxruntime-linux-x64-1.21.1/lib" >> $GITHUB_ENV

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Regenerate and diff
        run: bash scripts/check-openapi-drift.sh

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Run cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 6.2 Korean golden E2E — label-gated (label: `e2e-korean`).
  # ---------------------------------------------------------------------------
  e2e-korean:
    name: Korean E2E
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'e2e-korean')
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install onnxruntime
        run: |
          wget -q https://github.com/microsoft/onnxruntime/releases/download/v1.21.1/onnxruntime-linux-x64-1.21.1.tgz
          tar xzf onnxruntime-linux-x64-1.21.1.tgz
          echo "ORT_LIB_LOCATION=$PWD/onnxruntime-linux-x64-1.21.1/lib" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$PWD/onnxruntime-linux-x64-1.21.1/lib" >> $GITHUB_ENV
      - name: Run Korean E2E
        run: bash scripts/e2e-korean.sh

  # ---------------------------------------------------------------------------
  # 6.3 LLM token regression — label-gated (label: `token-bench`).
  # ---------------------------------------------------------------------------
  token-regression:
    name: Token Regression
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'token-bench')
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install onnxruntime
        run: |
          wget -q https://github.com/microsoft/onnxruntime/releases/download/v1.21.1/onnxruntime-linux-x64-1.21.1.tgz
          tar xzf onnxruntime-linux-x64-1.21.1.tgz
          echo "ORT_LIB_LOCATION=$PWD/onnxruntime-linux-x64-1.21.1/lib" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$PWD/onnxruntime-linux-x64-1.21.1/lib" >> $GITHUB_ENV
      - name: Run token regression check
        run: bash scripts/check-token-regression.sh

  # ---------------------------------------------------------------------------
  # 6.4 Frontend Playwright E2E — label-gated (label: `e2e-fe`).
  # ---------------------------------------------------------------------------
  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'e2e-fe')
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium firefox
      - name: Build
        run: pnpm build
      - name: Playwright
        run: pnpm test:e2e

  # ---------------------------------------------------------------------------
  # 6.5 Criterion bench regression — label-gated (label: `bench`).
  # ---------------------------------------------------------------------------
  bench-regression:
    name: Bench Regression
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'bench')
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install onnxruntime
        run: |
          wget -q https://github.com/microsoft/onnxruntime/releases/download/v1.21.1/onnxruntime-linux-x64-1.21.1.tgz
          tar xzf onnxruntime-linux-x64-1.21.1.tgz
          echo "ORT_LIB_LOCATION=$PWD/onnxruntime-linux-x64-1.21.1/lib" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$PWD/onnxruntime-linux-x64-1.21.1/lib" >> $GITHUB_ENV
      - name: Run benches
        run: cargo bench -p ox-api -- --output-format bencher | tee bench-output.txt
      - name: Compare against baseline
        run: bash scripts/check-bench-regression.sh bench-output.txt bench/baseline.json

  # ---------------------------------------------------------------------------
  # Single required-status aggregator for branch protection.
  # ---------------------------------------------------------------------------
  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [lint, test, deny, frontend]
    if: always()
    steps:
      - name: Aggregate status
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "deny=${{ needs.deny.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.deny.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "::error::One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed."
