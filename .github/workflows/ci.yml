name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # 6.1 Backend CI gates
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/install-onnxruntime

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (workspace, all targets, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/install-onnxruntime

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  deny:
    name: cargo-deny (advisories + licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  # ---------------------------------------------------------------------------
  # RLS enforcement — runs the `#[ignore]`-gated tests in
  # `crates/ox-store/tests/rls_enforcement.rs` against a live Postgres.
  #
  # These tests validate that `0004_rls.sql` actually isolates workspaces
  # at the row level. They can only run with a real DB connection, so we
  # keep them out of the default `cargo test` and gate them behind this
  # dedicated job. A missing or mis-applied RLS policy fails this job and
  # blocks the PR via the `summary` aggregator.
  # ---------------------------------------------------------------------------
  rls:
    name: RLS Enforcement
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ontosyx_app
          POSTGRES_PASSWORD: ontosyx-dev
          POSTGRES_DB: ontosyx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ontosyx_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OX_TEST_DATABASE_URL: postgres://ontosyx_app:ontosyx-dev@localhost:5432/ontosyx
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/install-onnxruntime

      - name: Run RLS enforcement tests
        # `--ignored` opts into the DB-live tests; the default `cargo test`
        # still skips them on machines without a Postgres fixture. The
        # migration + temporal integration tests live in the same crate
        # so we run them in the same job.
        run: |
          cargo test -p ox-store --test rls_enforcement -- --ignored --nocapture
          cargo test -p ox-store --test migration_0007 -- --ignored --nocapture
          cargo test -p ox-store --test temporal_integration -- --ignored --nocapture --test-threads=1

  udeps:
    # Advisory-only: reports unused deps. Not a gate until the baseline is clean.
    # Flip `continue-on-error: false` once `cargo udeps` reports no false positives.
    name: cargo-udeps (unused deps, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked
      - uses: ./.github/actions/install-onnxruntime
      - name: cargo udeps
        run: cargo +nightly udeps --workspace --all-targets

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: ESLint (max-warnings=0)
        # `pnpm lint` resolves to `eslint --max-warnings=0`; any new warning
        # fails this job and blocks the PR via the `summary` aggregator.
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Vitest
        run: pnpm test
      - name: Build
        run: pnpm build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Docker image
        run: docker build -t ontosyx:ci .

  openapi-drift:
    name: OpenAPI Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: ./.github/actions/install-onnxruntime

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Regenerate and diff
        run: bash scripts/check-openapi-drift.sh

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Run cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 6.2 Korean golden E2E — label-gated (label: `e2e-korean`).
  # ---------------------------------------------------------------------------
  e2e-korean:
    name: Korean E2E
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'e2e-korean')
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-onnxruntime
      - name: Run Korean E2E
        run: bash scripts/e2e-korean.sh

  # ---------------------------------------------------------------------------
  # 6.3 LLM token regression — label-gated (label: `token-bench`).
  # ---------------------------------------------------------------------------
  token-regression:
    name: Token Regression
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'token-bench')
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-onnxruntime
      - name: Run token regression check
        run: bash scripts/check-token-regression.sh

  # ---------------------------------------------------------------------------
  # 6.4 Frontend Playwright E2E — label-gated (label: `e2e-fe`).
  # ---------------------------------------------------------------------------
  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'e2e-fe')
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium firefox
      - name: Build
        run: pnpm build
      - name: Playwright
        # `test:e2e:no-build` skips the `pnpm build` the default alias
        # would chain — we just built in the step above, so rebuilding
        # would waste ~30s of CI time.
        run: pnpm test:e2e:no-build

  # ---------------------------------------------------------------------------
  # 6.5 Criterion bench regression — label-gated (label: `bench`).
  # ---------------------------------------------------------------------------
  bench-regression:
    name: Bench Regression
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'bench')
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-onnxruntime
      - name: Run benches
        run: cargo bench -p ox-api -- --output-format bencher | tee bench-output.txt
      - name: Compare against baseline
        run: bash scripts/check-bench-regression.sh bench-output.txt bench/baseline.json

  # ---------------------------------------------------------------------------
  # Single required-status aggregator for branch protection.
  # ---------------------------------------------------------------------------
  summary:
    name: CI summary
    runs-on: ubuntu-latest
    # Every always-running gate the branch-protection rule must block on.
    # Label-gated jobs (e2e-korean, token-regression, frontend-e2e,
    # bench-regression, udeps) are NOT required — they only run on demand.
    # `security` only runs on `push`, so it's conditionally inspected below.
    needs: [lint, test, deny, frontend, docker, openapi-drift, rls]
    if: always()
    steps:
      - name: Aggregate status
        # A result of `skipped` is accepted so that future `paths:` filters
        # on `docker` or `openapi-drift` (e.g. skipping Docker rebuilds on
        # docs-only PRs) don't falsely block the required status.
        # `failure` and `cancelled` still exit non-zero.
        run: |
          fail=0
          for job in lint test deny frontend docker openapi-drift rls; do
            case "$job" in
              lint)          result="${{ needs.lint.result }}" ;;
              test)          result="${{ needs.test.result }}" ;;
              deny)          result="${{ needs.deny.result }}" ;;
              frontend)      result="${{ needs.frontend.result }}" ;;
              docker)        result="${{ needs.docker.result }}" ;;
              openapi-drift) result="${{ needs.openapi-drift.result }}" ;;
              rls)           result="${{ needs.rls.result }}" ;;
            esac
            echo "$job=$result"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::Required job '$job' did not succeed (result=$result)"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "All required jobs passed (or were legitimately skipped)."
