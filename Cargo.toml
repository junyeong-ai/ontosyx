[workspace]
members = [
    "crates/ox-core",
    "crates/ox-ontology",
    "crates/ox-query-ir",
    "crates/ox-compiler",
    "crates/ox-runtime",
    "crates/ox-brain",
    "crates/ox-agent",
    "crates/ox-memory",
    "crates/ox-api",
    "crates/ox-store",
    "crates/ox-source",
    "crates/ox-federation",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
# Every in-repo crate is private. Marking them unpublished lets
# `cargo-deny`'s `allow-wildcard-paths` accept the `{ workspace = true }`
# references without requiring explicit version strings on path deps.
publish = false

[workspace.lints.clippy]
too_many_arguments = "allow"
items_after_test_module = "allow"

# Correctness gates. Test modules are exempted per-crate via
# `#![cfg_attr(test, allow(clippy::unwrap_used, clippy::expect_used, clippy::panic))]`.
# Binaries with legitimate startup-time `expect`s (e.g. `ox-api::main`
# initialising OTLP / Prometheus) opt out with a targeted
# `#![allow(clippy::expect_used)]` on the binary crate.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
dbg_macro = "deny"

# `let _ = expr_returning_result;` silently swallows `Result` errors
# in production paths. Telemetry / fire-and-forget call-sites switch
# to `if let Err(error) = ... { tracing::warn!(...) }` so DB outages
# don't disappear into the void. Test modules exempt via the same
# `#![cfg_attr(test, allow(...))]` block as the other gates.
let_underscore_must_use = "deny"

# Raw `tokio::spawn` in application code drops our workspace task-locals
# and breaks RLS. The forbidden-methods list lives in `clippy.toml` since
# Cargo.toml can't express structured lint arguments.
disallowed_methods = "deny"

[workspace.dependencies]
# Internal crates
ox-core = { path = "crates/ox-core" }
ox-compiler = { path = "crates/ox-compiler" }
ox-runtime = { path = "crates/ox-runtime" }
ox-brain = { path = "crates/ox-brain" }
ox-store = { path = "crates/ox-store" }
ox-source = { path = "crates/ox-source" }
ox-agent = { path = "crates/ox-agent" }
ox-memory = { path = "crates/ox-memory" }
ox-federation = { path = "crates/ox-federation" }
ox-ontology = { path = "crates/ox-ontology" }
ox-query-ir = { path = "crates/ox-query-ir" }

# LLM runtime
branchforge = { version = "0.9", default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.2", features = ["chrono04", "uuid1"] }
csv = "1"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# OpenAPI
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Database drivers
neo4rs = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "mysql", "chrono", "uuid"] }
mongodb = "3"
duckdb = { version = "1", default-features = false, features = ["bundled"] }
snowflake-api = "0.12"
# Arrow — snowflake-api returns query results as Arrow RecordBatches; we
# parse them directly rather than round-tripping through JSON. DataFusion
# 50.x is also pinned to Arrow 55 so the federation engine and the
# snowflake adapter share the same RecordBatch shape.
arrow = "55"
arrow-schema = "55"
arrow-array = "55"

# Federation execution engine — see docs/adr/0002-datafusion-federation.md.
# Pinned to the last release in the arrow-55 line so the workspace's
# existing arrow-55 consumers (snowflake-api, ox-source profilers)
# share one RecordBatch type with DataFusion. Bumping the major implies
# a coordinated arrow upgrade for snowflake-api and the adapter layer.
datafusion = "49"
# BigQuery client — Application Default Credentials first, service-account
# JSON file fallback. Default features use rustls.
gcp-bigquery-client = "0.22"
# OAuth2 / ADC token source — used by ox-source's `gcp_auth` module for the
# BigQuery adapter and (under the `gcp-sm` feature) ox-api's Secret Manager
# resolver. Same library `gcp-bigquery-client` uses internally, so the
# workspace pulls one version regardless of feature flags.
yup-oauth2 = "11"
# hyper connector type — `Authenticator<HttpsConnector<HttpConnector>>`
# needs `HttpConnector` from `hyper-util` (yup-oauth2 11 re-exports
# `hyper-rustls` but not `hyper-util`).
hyper-util = "0.1"
# Base64 — only the `gcp-sm` resolver decodes Secret Manager payloads
# directly here today, but the workspace already pulls a base64 build
# transitively (snowflake-jwt, neo4rs). Pinning at the workspace keeps
# the version aligned across direct + transitive use.
base64 = "0.22"

# LLM
reqwest = { version = "0.13", features = ["json", "stream"] }

# AWS
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = "1"

# Configuration
config = { version = "0.15", features = ["toml"] }

# File system / gitignore-aware walking (same as ripgrep)
ignore = "0.4"
tempfile = "3"

# Test mocking — used by the ox-api handler test harness.
mockall = "0.13"

# Crypto
subtle = "2"
jsonwebtoken = "9"
sha2 = "0.10"
# CSPRNG seed source — `rand::rngs::OsRng` for share-token / api-key
# plaintexts. Hoisted to the workspace so every crate inherits the
# same major and `OsRng`'s `getrandom` backend stays aligned.
rand = "0.10"

# Pattern matching (used for transient-error classification, etc.)
regex = "1"

# Lock-free atomic Arc swap — used for DomainContext.ontology so mid-session
# edits propagate to downstream tools without holding a RwLock across the
# GRAPH_ONTOLOGY task-local scope.
arc-swap = "1"

# MCP (Model Context Protocol)
rmcp = { version = "1.2", features = ["server", "macros", "transport-streamable-http-server"] }

# RDF / OWL
rio_api = "0.8"
rio_turtle = "0.8"

# Scheduling
cron = "0.15"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
dashmap = "6"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.31", features = ["trace"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.32"
