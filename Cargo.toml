[workspace]
members = [
    "crates/ox-core",
    "crates/ox-ontology",
    "crates/ox-query-ir",
    "crates/ox-compiler",
    "crates/ox-graph-runtime",
    "crates/ox-brain",
    "crates/ox-agent",
    "crates/ox-memory",
    "crates/ox-api",
    "crates/ox-store",
    "crates/ox-source",
    "crates/ox-federation",
    "crates/ox-text",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
# Every in-repo crate is private. Marking them unpublished lets
# `cargo-deny`'s `allow-wildcard-paths` accept the `{ workspace = true }`
# references without requiring explicit version strings on path deps.
publish = false

[workspace.lints.clippy]
too_many_arguments = "allow"
items_after_test_module = "allow"

# Correctness gates. Test modules are exempted per-crate via
# `#![cfg_attr(test, allow(clippy::unwrap_used, clippy::expect_used, clippy::panic))]`.
# Binaries with legitimate startup-time `expect`s (e.g. `ox-api::main`
# initialising OTLP / Prometheus) opt out with a targeted
# `#![allow(clippy::expect_used)]` on the binary crate.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
dbg_macro = "deny"

# `let _ = expr_returning_result;` silently swallows `Result` errors
# in production paths. Telemetry / fire-and-forget call-sites switch
# to `if let Err(error) = ... { tracing::warn!(...) }` so DB outages
# don't disappear into the void. Test modules exempt via the same
# `#![cfg_attr(test, allow(...))]` block as the other gates.
let_underscore_must_use = "deny"

# Raw `tokio::spawn` in application code drops our workspace task-locals
# and breaks RLS. The forbidden-methods list lives in `clippy.toml` since
# Cargo.toml can't express structured lint arguments.
disallowed_methods = "deny"

[workspace.dependencies]
# Internal crates
ox-core = { path = "crates/ox-core" }
ox-compiler = { path = "crates/ox-compiler" }
ox-graph-runtime = { path = "crates/ox-graph-runtime" }
ox-brain = { path = "crates/ox-brain" }
ox-store = { path = "crates/ox-store" }
ox-source = { path = "crates/ox-source", default-features = false }
ox-agent = { path = "crates/ox-agent" }
ox-memory = { path = "crates/ox-memory" }
ox-text = { path = "crates/ox-text" }
ox-federation = { path = "crates/ox-federation" }
ox-ontology = { path = "crates/ox-ontology" }
ox-query-ir = { path = "crates/ox-query-ir" }

# LLM runtime
branchforge = { version = "0.9", default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Codifies the `Option<T> + skip_if_none` wire-shape conventions
# documented in the root `CLAUDE.md` "DTO naming" section. Pulls in
# the `#[serde_with::skip_serializing_none]` derive helper +
# `chrono::DateTime<Utc>` aware type wrappers without forcing every
# call-site to carry serde attribute soup.
serde_with = { version = "3", features = ["chrono_0_4"] }
schemars = { version = "1.2", features = ["chrono04", "uuid1"] }
csv = "1"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
# Granular splits of `futures` — hoisted so every consumer (ox-api,
# ox-brain, …) shares one major and the SSE streaming + chat agents
# don't fork on `futures-core` traits.
futures-core = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"

# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# OpenAPI
utoipa = { version = "5.5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

# Database drivers
neo4rs = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "mysql", "chrono", "uuid"] }
mongodb = "3"
duckdb = { version = "1.10502", default-features = false, features = ["bundled"] }
snowflake-api = "0.14"
# Arrow — adapters and federation exchange query results as Arrow
# RecordBatches. Keep the direct dependency explicit so conversion code,
# DataFusion, and DuckDB stay on one Arrow line.
arrow = "58"
arrow-schema = "58"
arrow-array = "58"

# Federation execution engine — see docs/adr/0002-datafusion-federation.md.
# Keep this aligned with the arrow-* versions above so all adapter
# RecordBatch values cross the federation boundary without conversion.
datafusion = { version = "53", default-features = false, features = ["sql"] }
# BigQuery client — Application Default Credentials first, service-account
# JSON file fallback. Default features use rustls.
gcp-bigquery-client = "0.28"
# OAuth2 / ADC token source — used by ox-source's `gcp_auth` module for the
# BigQuery adapter and (under the `gcp-sm` feature) ox-api's Secret Manager
# resolver. Same library `gcp-bigquery-client` uses internally, so the
# workspace pulls one version regardless of feature flags.
yup-oauth2 = "12"
# hyper connector type — `Authenticator<HttpsConnector<HttpConnector>>`
# needs `HttpConnector` from `hyper-util` (yup-oauth2 11 re-exports
# `hyper-rustls` but not `hyper-util`).
hyper-util = "0.1"
# Base64 — only the `gcp-sm` resolver decodes Secret Manager payloads
# directly here today, but the workspace already pulls a base64 build
# transitively (snowflake-jwt, neo4rs). Pinning at the workspace keeps
# the version aligned across direct + transitive use.
base64 = "0.22"
hex = "0.4"

# LLM / outbound HTTP. Keep TLS explicit so downstream crates cannot
# re-enable reqwest's broad default surface implicitly.
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "json", "rustls", "stream"] }

# AWS
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = "1"

# Configuration
config = { version = "0.15", features = ["toml"] }
dotenvy = "0.15"

# File system / gitignore-aware walking (same as ripgrep)
ignore = "0.4"
tempfile = "3"

# Test mocking — used by the ox-api handler test harness.
mockall = "0.14"

# Crypto
subtle = "2"
jsonwebtoken = "10"
sha2 = "0.11"
# CSPRNG seed source — `rand::rngs::OsRng` for share-token / api-key
# plaintexts. Hoisted to the workspace so every crate inherits the
# same major and `OsRng`'s `getrandom` backend stays aligned.
rand = "0.10"

# Pattern matching (used for transient-error classification, etc.)
regex = "1"

# Lock-free atomic Arc swap — used for DomainContext.ontology so mid-session
# edits propagate to downstream tools without holding a RwLock across the
# GRAPH_ONTOLOGY task-local scope.
arc-swap = "1"

# MCP (Model Context Protocol)
rmcp = { version = "1.2", features = ["server", "macros", "transport-streamable-http-server"] }

# RDF / OWL
rio_api = "0.8"
rio_turtle = "0.8"

# Scheduling
cron = "0.16"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
dashmap = "6"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.31", features = ["trace"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.32"


# ----------------------------------------------------------------------------
# Build profiles
# ----------------------------------------------------------------------------
#
# Three-axis design — iteration speed, disk footprint, runtime
# performance — tuned independently per profile.
#
# **Workspace constraint:** the dependency graph is wide (DataFusion 53
# + Arrow 58 + tokio "full" + sqlx + duckdb + onnx + reqwest) and
# integration-test crates each statically link the entire graph. Default
# Cargo dev settings (full DWARF + 256 codegen units + dev-debuginfo on
# every transitive dep) push `target/` to ~150 GB on a clean build.
# The profile shape below holds the same workspace at ~5–8 GB without
# losing backtrace fidelity on workspace code.
#
# Profile axes:
#
#   `dev`     — `cargo build` / `cargo test` default. Backtrace-friendly,
#               deterministic, and bounded in disk growth.
#   `dev-fast`— opt-in profile for short-lived inner-loop work where
#               incremental rebuild latency matters more than cache size.
#   `test`    — inherits `dev` so local checks and integration tests use
#               the bounded default cache shape.
#   `release` — production binary. LTO, single codegen unit, stripped.
#
# Workspace-code debug info stays as `line-tables-only` so panics still
# carry file:line in stack traces. Variable inspection in `lldb` /
# `rust-gdb` falls back to `<unavailable>` — for the rare debugger
# session, override per-invocation:
#
#   RUSTFLAGS="-C debuginfo=2" cargo test -p <crate> -- <filter>

[profile.dev]
opt-level = 0
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false
codegen-units = 64

# Third-party deps don't get edited mid-iteration, so their debug info
# is dead weight. Drop it entirely — cuts the largest single
# contributor to dev-build disk usage (~80% of the transitive graph
# is non-workspace).
[profile.dev.package."*"]
opt-level = 0
debug = false

# Hot-path query execution layers (DataFusion + Arrow) — compile at
# `opt-level = 1` so integration tests that exercise the federation
# planner or the columnar pipeline finish in seconds rather than
# minutes. The `arrow-*` siblings stay aligned so trait dispatch
# inlining works across crate boundaries.
[profile.dev.package.datafusion]
opt-level = 1
debug = false
[profile.dev.package.arrow]
opt-level = 1
debug = false
[profile.dev.package.arrow-array]
opt-level = 1
debug = false
[profile.dev.package.arrow-buffer]
opt-level = 1
debug = false
[profile.dev.package.arrow-data]
opt-level = 1
debug = false
[profile.dev.package.arrow-schema]
opt-level = 1
debug = false
[profile.dev.package.arrow-cast]
opt-level = 1
debug = false
[profile.dev.package.arrow-select]
opt-level = 1
debug = false
[profile.dev.package.arrow-arith]
opt-level = 1
debug = false
[profile.dev.package.arrow-string]
opt-level = 1
debug = false
[profile.dev.package.arrow-ord]
opt-level = 1
debug = false

# Test profile mirrors `dev` so `cargo build` and `cargo test` warm
# the same fingerprint cache. Without this, the test profile's
# distinct `inherits = "test"` tree double-compiles every workspace
# crate.
[profile.test]
inherits = "dev"

[profile.dev-fast]
inherits = "dev"
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
debug = "line-tables-only"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
incremental = false
overflow-checks = false

[profile.container]
inherits = "release"
debug = false
lto = false
codegen-units = 16
strip = "symbols"
