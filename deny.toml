# cargo-deny configuration — Phase 6.1 CI gate.
# Checks advisories (vulnerabilities), licenses, and banned crates.
# Run locally: `cargo deny --all-features check --hide-inclusion-graph`.

[graph]
# Follow only normal/build deps; skip dev deps from the license check surface
# to avoid false positives from test-only tooling.
all-features = false
no-default-features = false

# ---------------------------------------------------------------------------
# Advisories — RustSec vulnerability database.
# ---------------------------------------------------------------------------
[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # mongodb 3.6.0 still pins hickory 0.25.x; remove when the driver
    # moves to hickory-proto >= 0.26.1.
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
    # neo4rs/backoff and DataFusion still carry these no-fix
    # unmaintained advisories transitively.
    "RUSTSEC-2025-0012",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2024-0436",
    # sqlx-mysql and snowflake-jwt transitively use rsa 0.9.x; no safe
    # patched rsa release is available for their current public APIs.
    "RUSTSEC-2023-0071",
    # neo4rs/rustls-native-certs still use the archived wrapper.
    "RUSTSEC-2025-0134",
]

# ---------------------------------------------------------------------------
# Licenses — allow permissive licenses; deny strong copyleft.
#
# Allowed: MIT / Apache / BSD / ISC / Zlib / Unicode — standard in the Rust
# ecosystem. MPL-2.0 is the one weak-copyleft carve-out (file-level copyleft,
# safe for linking).
# Denied by omission: GPL, AGPL, LGPL, SSPL, CC-BY-SA, etc.
# ---------------------------------------------------------------------------
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "MIT-0",
    "CDLA-Permissive-2.0",
]
# Confidence threshold for license detection (1.0 = strict).
confidence-threshold = 0.8
exceptions = []

# ring uses an OpenSSL-like license; accept via exception if necessary
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# ---------------------------------------------------------------------------
# Bans — duplicate versions, wildcard deps, denied crates, layered deps.
# Duplicates are "warn" to avoid gate flakiness until the tree is clean.
#
# Layered crate DAG is enforced by `wrappers`: listed crates may only be
# depended on by the wrapper list. Reverse-direction edges (e.g. storage
# layer pulling in the LLM layer) break the build.
#
# Target DAG (see docs/architecture/crate-dag.md):
#
#   ox-core ← ox-ontology ← ox-query-ir ← ox-graph-runtime ← ox-federation ← ox-agent ← ox-api
#   ox-core ← ox-source   ←┘
#   ox-core ← ox-store    ← ox-federation / ox-agent / ox-api
#   ox-core ← ox-memory   ← ox-brain ← ox-agent
#
# Storage / introspection / runtime layers must never acquire a reverse
# dependency on the orchestration layer (ox-brain, ox-agent).
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies have no explicit version and would otherwise
# trip `wildcards = "deny"`. This flag exempts only the in-repo
# `path = "crates/..."` edges; external wildcard deps still fail.
allow-wildcard-paths = true
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
skip = []
skip-tree = []

# Reverse-dep guards. Each entry pins a crate (`crate`) and the exhaustive
# list of crates allowed to depend on it (`wrappers`). Anything outside
# the wrapper list pulling in the pinned crate is a `cargo deny` error.
[[bans.deny]]
crate = "ox-brain"
wrappers = ["ox-agent", "ox-api"]

[[bans.deny]]
crate = "ox-agent"
wrappers = ["ox-api"]

[[bans.deny]]
crate = "ox-memory"
wrappers = ["ox-brain", "ox-agent", "ox-api"]

# ox-federation is the VOL execution engine (ADR 0001 + 0002). Only the
# orchestration / API layer should link against it; anything closer to
# the DB (ox-store, ox-source, ox-graph-runtime, ox-brain) must not flip the
# dependency direction.
[[bans.deny]]
crate = "ox-federation"
wrappers = ["ox-api"]

# ox-ontology (Phase 3) lives above ox-core. Any crate above the base
# may depend on it; ox-core itself must not (that would re-enter the
# loop ox-ontology is being split out of). Wildcards here include the
# full upstream set, and the list is intentionally maintained manually
# so a reverse edge from ox-core (re-exports, etc.) is rejected.
[[bans.deny]]
crate = "ox-ontology"
wrappers = [
    "ox-ontology",
    "ox-query-ir",
    "ox-compiler",
    "ox-graph-runtime",
    "ox-brain",
    "ox-agent",
    "ox-store",
    "ox-source",
    "ox-text",
    "ox-federation",
    "ox-api",
]

# ox-query-ir (Phase 3) lives above ox-ontology. ox-store also needs it
# because SavedQueryPattern persists a PatternIR JSONB blob; every other
# layer that composes ox-query-ir is above persistence.
[[bans.deny]]
crate = "ox-query-ir"
wrappers = [
    "ox-compiler",
    "ox-graph-runtime",
    "ox-store",
    "ox-brain",
    "ox-agent",
    "ox-federation",
    "ox-api",
]

# ---------------------------------------------------------------------------
# Sources — registries and git allow-lists.
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
